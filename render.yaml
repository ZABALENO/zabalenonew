# Render Blueprint: vytvoří databázi i web service najednou (New + → Blueprint).
databases:
  - name: zabaleno-db
    plan: free
services:
  - type: web
    name: zabaleno
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: zabaleno-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PARTNER_EMAIL
        sync: false
      - key: PARTNER_PASSWORD
        sync: false
